services:
  # Test database. Plain postgres - nothing here needs PostGIS.
  main_db:
    image: postgres:18-alpine
    container_name: py_app_runner_database
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  # Development
  develop:
    container_name: py_app_runner_develop
    restart: "no"
    depends_on:
      - main_db
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: development
      args:
        GIT_NAME: ${GIT_NAME:-}
        GIT_EMAIL: ${GIT_EMAIL:-}
        LOCAL_USER_ID: ${LOCAL_USER_ID:-1000}
        LOCAL_GROUP_ID: ${LOCAL_GROUP_ID:-1000}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/srv/app
