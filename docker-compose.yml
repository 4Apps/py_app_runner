services:
  # Test database. Plain postgres - nothing here needs PostGIS.
  main_db:
    image: postgres:18-alpine
    container_name: py_app_runner_database
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # `depends_on` alone only orders startup. The migration integration tests need Postgres
    # to actually accept connections, or a CI run started a second too early tests nothing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Development
  develop:
    container_name: py_app_runner_develop
    restart: "no"
    depends_on:
      main_db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: development
      args:
        GIT_NAME: ${GIT_NAME:-}
        GIT_EMAIL: ${GIT_EMAIL:-}
        LOCAL_USER_ID: ${LOCAL_USER_ID:-1000}
        LOCAL_GROUP_ID: ${LOCAL_GROUP_ID:-1000}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/srv/app
