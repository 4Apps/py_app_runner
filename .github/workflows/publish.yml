name: Publish

# A GitHub release is the trigger, not a push. A version on PyPI is permanent - it cannot
# be replaced, and a deleted one cannot be re-uploaded - so minting one stays a deliberate
# act. Pushing the tag is safe; creating the release from it is the point of no return.
on:
  release:
    types: [published]

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  publish:
    name: Build & Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Mandatory for trusted publishing; no API token is stored anywhere
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          # scripts/version.bash derives the patch from the commit count, so it needs the
          # full history - a shallow clone would silently produce version .1
          fetch-depth: 0

      # A GitHub pre-release would publish a plain final version here, which is not what
      # the marking says. Pre-releases come off develop, automatically, as .devN
      - name: Refuse a GitHub pre-release
        if: ${{ github.event.release.prerelease }}
        run: |
          echo "::error::${{ github.event.release.tag_name }} is marked as a pre-release." >&2
          echo "Pre-releases are published from the develop branch as X.Y.N.dev0." >&2
          exit 1

      # The tag is written by hand often enough to be worth checking against the derived
      # value. A mismatch here means the tag and the wheel would disagree about what this
      # release is, which nothing downstream can untangle afterwards.
      - name: Resolve and verify version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(scripts/version.bash)"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match the derived version v${VERSION}." >&2
            echo "Tags are created by scripts/release_tag.bash; delete this one and re-cut it." >&2
            exit 1
          fi
          echo "$VERSION" > .version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing py_app_runner $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install -U build twine

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          python -m build

      # An unreadable or empty .version makes setuptools fall back to 0.0.0 rather than
      # fail, and 0.0.0 on PyPI could never be withdrawn. Assert the filename rather than
      # trusting that the rewrite above landed.
      - name: Verify built version
        run: |
          if [ ! -f "dist/py_app_runner-${VERSION}-py3-none-any.whl" ]; then
            echo "::error::expected dist/py_app_runner-${VERSION}-py3-none-any.whl, built:" >&2
            ls -1 dist >&2
            exit 1
          fi

      # Catches a README that will not render on PyPI, which is otherwise only found out
      # by the upload failing after the release has already been published
      - name: Check distributions
        run: twine check --strict dist/*

      # No skip-existing: a duplicate here means the release was cut twice and should fail
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
