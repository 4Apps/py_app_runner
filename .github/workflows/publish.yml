name: Build & Publish

# Manual only. Pushes to master are tested by test.yml; cutting a wheel is a
# deliberate act because the artifact is permanent and downstream projects pin it.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve build version
        run: |
          MAJOR_MINOR=$(cat .version)
          COUNT=$(git rev-list --count HEAD)
          VERSION="${MAJOR_MINOR}.${COUNT}"
          echo "$VERSION" > .version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building py_app_runner $VERSION"

      - name: Create docker external network
        run: docker network create py_app_runner_network || true

      - name: Pull latest base image
        run: docker pull debian:trixie-slim

      - name: Build development image
        run: docker compose build develop

      - name: Run code tests
        run: docker compose run --rm develop /srv/meta/scripts/code_tests.bash

      - name: Build wheel
        run: |
          rm -rf build dist
          docker compose run --rm develop pip wheel /srv/app --no-deps -w /srv/app/dist

      # The runner lives on processing, the wheels are served from 4apps.lv
      - name: Publish wheel
        env:
          PUBLISH_HOST: services@4apps.lv
          PUBLISH_DIR: /srv/services/4apps-www/public/apps/py
        run: |
          NAME="py_app_runner-${VERSION}-py3-none-any.whl"
          scp -o BatchMode=yes "dist/$NAME" "$PUBLISH_HOST:$PUBLISH_DIR/$NAME"
          ssh -o BatchMode=yes "$PUBLISH_HOST" \
            "ln -sfn '$NAME' '$PUBLISH_DIR/py_app_runner-latest-py3-none-any.whl'"
          echo "Published $NAME"

  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [build]
    if: always()
    steps:
      - name: Clean up dist
        run: rm -rf dist/
