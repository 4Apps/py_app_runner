[build-system]
# PEP 639 license expressions (the "license"/"license-files" keys below) need 77+
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py_app_runner"
dynamic = ["version"]
description = "Async service framework: Tornado HTTP/WS bridge, service loader, Redis WS connection manager"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gints Murans", email = "gm@gm.lv" }]
keywords = [
    "async",
    "tornado",
    "websocket",
    "framework",
    "service",
    "redis",
    "postgresql",
    "sqlite",
    "migrations",
    "queue",
    "cron",
]
# No "License ::" classifier: it is deprecated alongside Metadata 2.4, and setuptools
# refuses one next to the license expression above
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    # uvloop is a hard dependency and does not build on Windows
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Floors only, plus a cap where a breaking major is known: an upper bound here binds every
# project installing this package.
dependencies = [
    # Floors exclude releases with published security advisories, lacking Python 3.13 wheels
    # (uvloop, msgspec) or lacking an API used here (sentry-sdk get_isolation_scope)
    "sentry-sdk >= 2.12.0, < 3",
    "python-dotenv >= 1.2.2",
    "uvloop >= 0.21.0",
    "msgspec >= 0.19.0",
    "msgpack >= 1.2.4",
    "tornado >= 6.5.9",
    # The extras pull the base package in, so one pin rather than three that must be kept
    # in lockstep. 0.3.146 is the first MIT release - 0.2.38 and earlier are GPL-3.0.
    "database_wrapper[pgsql,redis,sqlite] == 0.3.147",
    # Used directly by py_app_runner.migrations, not only through database_wrapper, so the
    # floor is declared here rather than inherited. Matches database_wrapper_pgsql 0.3.146's
    # own psycopg[binary]/psycopg[pool] >= 3.2.0.
    "psycopg >= 3.2.0",
    "psycopg[pool] >= 3.2.0",
    "redis >= 4.5.4",
    "pyjwt >= 2.15.0",
]

# A service that is not in SERVICES is never imported, so its library need not be installed.
# The import site raises a message naming the extra when it is missing.
[project.optional-dependencies]
crypto = [
    # AES-256-GCM. 44 added XChaCha20Poly1305, the obvious alternative if AES-GCM's 96-bit
    # nonce ever becomes uncomfortable; 50.0.0 excludes releases with published advisories.
    "cryptography >= 50.0.0",
    "bcrypt >= 4.2.0",
]
cron = [
    # Cron expression matching. Zero dependencies, DST-aware.
    "cronsim >= 2.6",
]
all = ["py_app_runner[crypto,cron]"]
# Minor-pinned: a new ruff or pyrefly minor changes what fails the build
dev = [
    "py_app_runner[all]",
    "pyrefly == 1.4.*",
    "ruff == 0.17.*",
    "pytest == 9.1.*",
    "pytest-asyncio == 1.4.*",
]

[project.urls]
Homepage = "https://github.com/4Apps/py_app_runner"
Documentation = "https://github.com/4Apps/py_app_runner/blob/master/AGENTS.md"
Code = "https://github.com/4Apps/py_app_runner"
"Issue Tracker" = "https://github.com/4Apps/py_app_runner/issues"
Download = "https://pypi.org/project/py-app-runner/"

[tool.setuptools.packages.find]
where = ["src"]

# Without the marker file in the wheel, a downstream type checker ignores every
# annotation in this package (PEP 561). The SQL templates are what the `install`
# subcommands copy into a project.
[tool.setuptools.package-data]
"py_app_runner" = ["py.typed", "*/files/*.sql"]

# Manual major.minor in .version; CI appends the git commit count as the patch part.
# A local build therefore reports a bare "0.4" - scripts/version.bash prints what a
# release of this commit would actually publish as.
[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# For some reason this needs to be here to show errors in VSCode
[tool.pyrefly]
site-package-path = ["/srv/venv/lib64/python3.13/site-packages"]
